name: Build and Push Docker Image (amd64)

permissions:
  contents: read
  packages: write

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
   
jobs:
  call-docker-publish:
    uses: mihaiush/ci/.github/workflows/docker-publish.yml@main
    with:
      dockervars: |
        TAG=$(awk -F'-' '/^FROM /{printf("%0.4f",$(NF-1)/10000-2000)}' Dockerfile | head -1 | awk -F'.' '{print $1"."(0+$2)}')
